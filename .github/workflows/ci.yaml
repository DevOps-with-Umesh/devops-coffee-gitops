# CI pipeline: test → build image → push to GHCR → update the image tag in Git.
# Argo CD watches k8s/ in this repo and deploys the new tag by itself (that's the CD part).
name: CI – build & release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -v tests

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the new image tag
      packages: write   # to push the image to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Set image name and version
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${OWNER}/devops-coffee" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=$(cat app/VERSION)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3      # build for Apple Silicon (arm64) too
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Update image tag in Git (Argo CD picks this up)
        run: |
          sed -i "s#^\(\s*newName:\).*#\1 ${IMAGE}#" k8s/kustomization.yaml
          sed -i "s#^\(\s*newTag:\).*#\1 \"${TAG}\"#" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "deploy: devops-coffee ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
