apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-coffee
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DevOps-with-Umesh/devops-coffee-gitops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-coffee
  syncPolicy:
    automated:
      prune: true      # delete things that were removed from Git
      selfHeal: true   # undo manual kubectl changes: Git always wins
    syncOptions:
      - CreateNamespace=true
