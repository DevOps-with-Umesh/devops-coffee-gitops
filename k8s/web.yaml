apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: devops-coffee
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # zero-downtime: old pods stay until new ones are ready
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: devops-coffee
    spec:
      # Don't inject docker-link style env vars (e.g. REDIS_PORT=tcp://...) for
      # Services in the namespace; they collide with the app's REDIS_PORT setting.
      enableServiceLinks: false
      containers:
        - name: web
          image: devops-coffee   # real image + tag are set in kustomization.yaml (updated by CI)
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: SHOP_NAME
              value: DevOps Coffee
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http          # the ServiceMonitor (Part 2: monitoring) finds the app by this name
      port: 80
      targetPort: 8080
